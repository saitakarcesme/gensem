name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify generated artifacts and regression tests
        working-directory: gse-one
        run: python3 gse_generate.py --verify
      - name: Check generated artifacts are committed
        run: |
          changes=$(git status --porcelain --untracked-files=all -- gse-one/plugin)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
